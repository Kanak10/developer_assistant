    "langchain-openai>=1.8.1",
    "openai>=1.0.0",
    "langfuse>=5.2.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langsmith>=0.15.0",
    "logfire[fastapi,requests]>=5.6.0",
    "loguru>=0.7.3",
    "nemoguardrails>=0.23.0",
